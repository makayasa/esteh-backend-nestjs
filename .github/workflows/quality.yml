name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Synthetic, unreachable database: generate needs a URL; current e2e
      # checks not-ready. Add an isolated PostgreSQL service for DB tests later.
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/esteh_ci?connect_timeout=1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Require session progress for PR changes
        if: github.event_name == 'pull_request'
        env:
          HARNESS_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run harness:check -- --base "$HARNESS_BASE"
